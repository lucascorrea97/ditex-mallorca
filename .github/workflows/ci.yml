name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint • typecheck • build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build runs before Typecheck on purpose: `next build` generates the type
      # declarations `tsc` needs (next-env.d.ts — which types static image
      # imports — and .next/types route validators), both gitignored and absent
      # on a fresh checkout. The db client is lazy (see db/index.ts), so this
      # needs no live DATABASE_URL. Migrations are NOT run here — Vercel runs
      # them on deploy via the buildCommand in vercel.json.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
